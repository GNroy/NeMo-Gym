hermes_agent:
  responses_api_agents:
    hermes_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
      concurrency: 32
      max_turns: 30
      enabled_toolsets: null
      temperature: 1.0
      terminal_backend: local
      terminal_timeout: 60
