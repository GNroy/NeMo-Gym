hermes_agent:
  responses_api_agents:
    hermes_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      model_server:
        type: responses_api_models
        name: policy_model
      concurrency: 32
      max_turns: 30
      enabled_toolsets: null
      temperature: 1.0
      terminal_backend: local
      terminal_timeout: 60
      system_prompt: null
      # Phase 0: per-agent HERMES_HOME and persistence.  Defaults preserve
      # the original benchmark behavior (everything off); ns hermes_agent_rollouts
      # (Phase 1) overlays these per agent.
      hermes_home: null
      persist_memory: false
      persist_skills: false
      persist_session: false
      save_trajectories: false
      enable_compression: false
      trace_dir: null
      agent_name: null
      # Phase 0.5: orchestrator-facing peer map.  Populated by the
      # ns hermes_agent_rollouts pipeline via overlay JSON; the bundled
      # peer_agents Hermes plugin registers a `call_<name>` tool per entry.
      peer_agents: null
